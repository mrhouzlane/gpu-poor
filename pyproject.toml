[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpu-poor"
version = "0.1.0"
description = "Config-only decode rooflines and GPU rental cost ranges"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mehdi Rhouzlane"}]
dependencies = ["huggingface_hub>=0.27,<2", "transformers>=4.48,<6"]

[project.optional-dependencies]
app = ["gradio>=5.50,<7"]
data = ["datasets>=3,<6"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
gpu-poor = "gpu_poor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_poor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["datasets"]
ignore_missing_imports = true
